# Vet, test and cross-compile on every push and pull request.
#
# The tests run on Linux and Windows, on the bergesenlabs org runners linux-1
# and windows-1, because the wrapper spawns and kills processes, which is where
# platforms differ. There is no macOS runner: macOS is covered by the darwin
# cross-compile in the build job only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows]
    runs-on: [self-hosted, bergesen-big, "${{ matrix.os }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    needs: test
    runs-on: [self-hosted, bergesen-big, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Every platform the download page offers has to keep compiling.
      - name: Cross-compile the released targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=ci" \
              -o dist/vivere-$os-$arch$ext ./cmd/vivere
          done
          ls -la dist
      # A wrapper whose own --help is broken is a bad first impression.
      - name: Smoke-test the native binary
        run: |
          go build -ldflags="-X main.version=ci" -o vivere ./cmd/vivere
          ./vivere version | grep -q "vivere ci"
          ./vivere --help | grep -q "vivere run"
